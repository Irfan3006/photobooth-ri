<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E62129"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.9"/>

  <!-- Top Red / Bottom White Flag Emblem -->
  <g transform="translate(186, 75)">
    <rect x="0" y="0" width="140" height="35" rx="6" fill="#E62129" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="0" y="35" width="140" height="35" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Stylized Camera Body -->
  <rect x="116" y="180" width="280" height="200" rx="36" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Camera Top bump -->
  <path d="M 200 180 L 220 150 L 292 150 L 312 180 Z" fill="#FFFFFF"/>
  <!-- Flash Dot -->
  <circle cx="340" cy="215" r="14" fill="url(#goldGrad)"/>

  <!-- Camera Lens (Outer + Inner + Reflection) -->
  <circle cx="256" cy="280" r="68" fill="#B71C1C"/>
  <circle cx="256" cy="280" r="54" fill="#212121"/>
  <circle cx="256" cy="280" r="42" fill="#E62129"/>
  <circle cx="256" cy="280" r="26" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="270" cy="266" r="10" fill="#FFFFFF"/>

  <!-- 81 Badge in Gold -->
  <g transform="translate(196, 395)">
    <rect x="0" y="0" width="120" height="46" rx="23" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="60" y="32" font-family="'Outfit', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#B71C1C" text-anchor="middle" letter-spacing="1">RI 81</text>
  </g>
</svg>
