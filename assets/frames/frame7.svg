<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Modern Gradient Palette -->
    <linearGradient id="modernRed7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D44" />
      <stop offset="50%" stop-color="#E62129" />
      <stop offset="100%" stop-color="#990006" />
    </linearGradient>

    <linearGradient id="goldGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <linearGradient id="whiteRibbon7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECEFF1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- OUTER BORDERS -->
  <rect x="14" y="14" width="1172" height="1472" rx="28" fill="none" stroke="url(#modernRed7)" stroke-width="12" />
  <rect x="26" y="26" width="1148" height="1448" rx="20" fill="none" stroke="url(#goldGrad7)" stroke-width="4" />

  <!-- TOP HEADER (Modern Twibbon Geometric Arch) -->
  <g filter="url(#shadow7)">
    <!-- Red Upper Canopy -->
    <path d="M 26,26 L 1174,26 L 1174,200 C 950,260 250,260 26,200 Z" fill="url(#modernRed7)" />
    <!-- White Intersecting Ribbon -->
    <path d="M 26,190 C 250,250 950,250 1174,190 L 1174,210 C 950,270 250,270 26,210 Z" fill="url(#whiteRibbon7)" />
    <!-- Gold Trim Line -->
    <path d="M 26,210 C 250,270 950,270 1174,210" fill="none" stroke="url(#goldGrad7)" stroke-width="4" />
  </g>

  <!-- TOP 81 GOLDEN LAUREL EMBLEM -->
  <g transform="translate(600, 115)" filter="url(#shadow7)">
    <!-- Shield / Hexagon Badge -->
    <polygon points="0,-50 45,-25 45,25 0,50 -45,25 -45,-25" fill="url(#goldGrad7)" stroke="#FFFFFF" stroke-width="3" />
    <text x="0" y="16" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#B71C1C" text-anchor="middle">81</text>
    
    <!-- Laurel Wreath (Left) -->
    <g fill="url(#goldGrad7)">
      <ellipse cx="-60" cy="-20" rx="8" ry="16" transform="rotate(-40 -60 -20)" />
      <ellipse cx="-75" cy="0" rx="8" ry="16" transform="rotate(-70 -75 0)" />
      <ellipse cx="-65" cy="25" rx="8" ry="16" transform="rotate(-110 -65 25)" />
      <ellipse cx="-45" cy="45" rx="8" ry="16" transform="rotate(-140 -45 45)" />
    </g>

    <!-- Laurel Wreath (Right) -->
    <g fill="url(#goldGrad7)">
      <ellipse cx="60" cy="-20" rx="8" ry="16" transform="rotate(40 60 -20)" />
      <ellipse cx="75" cy="0" rx="8" ry="16" transform="rotate(70 75 0)" />
      <ellipse cx="65" cy="25" rx="8" ry="16" transform="rotate(110 65 25)" />
      <ellipse cx="45" cy="45" rx="8" ry="16" transform="rotate(140 45 45)" />
    </g>
  </g>

  <!-- TOP TITLE TYPOGRAPHY -->
  <g filter="url(#shadow7)">
    <text x="600" y="195" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="235" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="url(#goldGrad7)" text-anchor="middle" letter-spacing="6">
      PAHLAWAN KEMERDEKAAN &bull; 17 AGUSTUS 2026
    </text>
  </g>

  <!-- SIDE GEOMETRIC ACCENTS -->
  <g fill="url(#modernRed7)" opacity="0.9">
    <polygon points="26,620 70,640 70,680 26,700" />
    <polygon points="26,720 60,735 60,760 26,775" fill="url(#goldGrad7)" />

    <polygon points="1174,620 1130,640 1130,680 1174,700" />
    <polygon points="1174,720 1140,735 1140,760 1174,775" fill="url(#goldGrad7)" />
  </g>

  <!-- BOTTOM FOOTER (Contemporary Geometric Base) -->
  <g filter="url(#shadow7)">
    <!-- Dark Red Curved Panel -->
    <path d="M 26,1280 C 250,1220 950,1220 1174,1280 L 1174,1474 L 26,1474 Z" fill="url(#modernRed7)" />
    <!-- Gold Top Trim -->
    <path d="M 26,1280 C 250,1220 950,1220 1174,1280" fill="none" stroke="url(#goldGrad7)" stroke-width="5" />

    <!-- Center White Pill Badge -->
    <g transform="translate(600, 1345)">
      <rect x="-290" y="-35" width="580" height="70" rx="35" fill="#FFFFFF" stroke="url(#goldGrad7)" stroke-width="4" filter="url(#shadow7)" />
      <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="900" font-size="38" fill="#B71C1C" text-anchor="middle" letter-spacing="3">
        KARANGJAMBE RT 05
      </text>
    </g>

    <!-- Subtitle text -->
    <text x="600" y="1430" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">
      BERSATU KITA TEGUH &bull; MERDEKA!
    </text>
  </g>
</svg>
