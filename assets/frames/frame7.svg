<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Modern Gradient Palette -->
    <linearGradient id="modernRed7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D44" />
      <stop offset="50%" stop-color="#E62129" />
      <stop offset="100%" stop-color="#990006" />
    </linearGradient>

    <linearGradient id="goldGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- OUTER BORDERS -->
  <rect x="14" y="14" width="1172" height="1472" rx="24" fill="none" stroke="url(#modernRed7)" stroke-width="12" />
  <rect x="24" y="24" width="1152" height="1452" rx="16" fill="none" stroke="url(#goldGrad7)" stroke-width="4" />

  <!-- TOP HEADER (Modern Twibbon Geometric Arch) -->
  <g filter="url(#shadow7)">
    <path d="M 24,24 L 1176,24 L 1176,220 C 850,270 350,270 24,220 Z" fill="url(#modernRed7)" />
    <path d="M 24,220 C 350,270 850,270 1176,220 L 1176,234 C 850,284 350,284 24,234 Z" fill="#FFFFFF" />
    <path d="M 24,234 C 350,284 850,284 1176,234" fill="none" stroke="url(#goldGrad7)" stroke-width="3" />
  </g>

  <!-- TOP 81 GOLDEN MEDALLION WITH LAUREL WREATH -->
  <g transform="translate(600, 100)" filter="url(#shadow7)">
    <!-- Laurel Wreath (Left) -->
    <g fill="url(#goldGrad7)">
      <ellipse cx="-52" cy="-14" rx="6" ry="14" transform="rotate(-35 -52 -14)" />
      <ellipse cx="-64" cy="6" rx="6" ry="14" transform="rotate(-65 -64 6)" />
      <ellipse cx="-54" cy="26" rx="6" ry="14" transform="rotate(-105 -54 26)" />
    </g>

    <!-- Laurel Wreath (Right) -->
    <g fill="url(#goldGrad7)">
      <ellipse cx="52" cy="-14" rx="6" ry="14" transform="rotate(35 52 -14)" />
      <ellipse cx="64" cy="6" rx="6" ry="14" transform="rotate(65 64 6)" />
      <ellipse cx="54" cy="26" rx="6" ry="14" transform="rotate(105 54 26)" />
    </g>

    <!-- Shield Emblem -->
    <polygon points="0,-42 36,-20 36,20 0,42 -36,20 -36,-20" fill="url(#goldGrad7)" stroke="#FFFFFF" stroke-width="2.5" />
    <polygon points="0,-34 28,-15 28,15 0,34 -28,15 -28,-15" fill="#FFFFFF" />
    <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#B71C1C" text-anchor="middle">81</text>
  </g>

  <!-- TOP TITLE TYPOGRAPHY (CLEAN & SPACED) -->
  <g filter="url(#shadow7)">
    <text x="600" y="185" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="222" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#goldGrad7)" text-anchor="middle" letter-spacing="6">
      PAHLAWAN KEMERDEKAAN &#8226; 17 AGUSTUS 2026
    </text>
  </g>

  <!-- SIDE GEOMETRIC ACCENTS -->
  <g fill="url(#modernRed7)" opacity="0.9">
    <polygon points="24,620 65,635 65,670 24,685" />
    <polygon points="24,705 55,718 55,740 24,752" fill="url(#goldGrad7)" />

    <polygon points="1176,620 1135,635 1135,670 1176,685" />
    <polygon points="1176,705 1145,718 1145,740 1176,752" fill="url(#goldGrad7)" />
  </g>

  <!-- BOTTOM FOOTER (Contemporary Geometric Base) -->
  <g filter="url(#shadow7)">
    <path d="M 24,1270 C 350,1210 850,1210 1176,1270 L 1176,1476 L 24,1476 Z" fill="url(#modernRed7)" />
    <path d="M 24,1270 C 350,1210 850,1210 1176,1270" fill="none" stroke="url(#goldGrad7)" stroke-width="5" />

    <!-- Center White Pill Badge -->
    <g transform="translate(600, 1340)">
      <rect x="-280" y="-34" width="560" height="68" rx="34" fill="#FFFFFF" stroke="url(#goldGrad7)" stroke-width="3" />
      <text x="0" y="13" font-family="'Outfit', sans-serif" font-weight="900" font-size="36" fill="#B71C1C" text-anchor="middle" letter-spacing="3">
        KARANGJAMBE RT 05
      </text>
    </g>

    <!-- Subtitle text -->
    <text x="600" y="1425" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">
      BERSATU KITA TEGUH &#8226; MERDEKA!
    </text>
  </g>
</svg>
