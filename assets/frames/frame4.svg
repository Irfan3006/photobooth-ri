<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Shadow for bubbles and text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.25" />
    </filter>
    
    <!-- Gold Balloon Gradient -->
    <linearGradient id="goldBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Red Balloon Gradient -->
    <linearGradient id="redBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A80" />
      <stop offset="50%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
  </defs>

  <!-- Festive Confetti Background Border (Only borders) -->
  <!-- Outer Borders -->
  <rect x="0" y="0" width="1200" height="1500" fill="none" stroke="#FF5722" stroke-width="16" />
  <rect x="16" y="16" width="1168" height="1468" fill="none" stroke="#FFEB3B" stroke-width="10" />

  <!-- TOP BUNTING FLAGS (Red & White triangles hanging down) -->
  <g transform="translate(0, 26)">
    <!-- String -->
    <path d="M 16,30 Q 300,100 600,30 Q 900,100 1184,30" fill="none" stroke="#B0BEC5" stroke-width="3" />
    
    <!-- Flags -->
    <polygon points="50,38 100,50 90,140 50,110" fill="#E53935" />
    <polygon points="50,38 100,50 95,95 50,75" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="150,55 200,62 195,150 150,130" fill="#E53935" />
    <polygon points="150,55 200,62 197,105 150,90" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="250,68 300,70 295,160 250,145" fill="#E53935" />
    <polygon points="250,68 300,70 297,115 250,105" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="350,70 400,68 395,160 350,145" fill="#E53935" />
    <polygon points="350,70 400,68 397,115 350,110" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="450,62 500,55 495,150 450,130" fill="#E53935" />
    <polygon points="450,62 500,55 497,105 450,95" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <!-- Center Gap for Title -->

    <polygon points="700,55 750,62 745,150 700,130" fill="#E53935" />
    <polygon points="700,55 750,62 747,105 700,95" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="800,68 850,70 845,160 800,145" fill="#E53935" />
    <polygon points="800,68 850,70 847,115 800,105" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="900,70 950,68 945,160 900,145" fill="#E53935" />
    <polygon points="900,70 950,68 947,115 900,110" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="1000,62 1050,55 1045,150 1000,130" fill="#E53935" />
    <polygon points="1000,62 1050,55 1047,105 1000,95" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />

    <polygon points="1100,50 1150,38 1145,110 1100,140" fill="#E53935" />
    <polygon points="1100,50 1150,38 1147,75 1100,95" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.5" />
  </g>

  <!-- TOP HEADER (Cheerful Badge) -->
  <g transform="translate(600, 110)" filter="url(#shadow)">
    <!-- Red Cloud/Banner -->
    <rect x="-350" y="-55" width="700" height="110" rx="55" fill="#E53935" stroke="#FFFFFF" stroke-width="6" />
    <text x="0" y="-10" font-family="'Outfit', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="0" y="32" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#FFEB3B" text-anchor="middle" letter-spacing="1">
      LOMBA 17-AN KARANGJAMBE
    </text>
  </g>

  <!-- BALLOONS DECORATION -->
  <!-- Left Side Balloons -->
  <g transform="translate(100, 320)" filter="url(#shadow)">
    <!-- Balloon 1 (Red) -->
    <g transform="translate(20, -50) scale(1.3)">
      <path d="M 0,0 C -30,-10 -40,-60 0,-70 C 40,-60 30,-10 0,0 Z" fill="url(#redBalloon)" />
      <polygon points="0,0 -6,10 6,10" fill="#E53935" />
      <path d="M 0,10 Q -20,50 10,90" fill="none" stroke="#757575" stroke-width="3" />
    </g>
    <!-- Balloon 2 (White) -->
    <g transform="translate(-20, 0) scale(1.1)">
      <path d="M 0,0 C -30,-10 -40,-60 0,-70 C 40,-60 30,-10 0,0 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />
      <polygon points="0,0 -6,10 6,10" fill="#E0E0E0" />
      <path d="M 0,10 Q 15,40 -10,80" fill="none" stroke="#757575" stroke-width="2" />
    </g>
  </g>

  <!-- Right Side Balloons & Big "81" -->
  <g transform="translate(1080, 290)" filter="url(#shadow)">
    <!-- Balloon Gold -->
    <g transform="translate(-50, -20) scale(1.2)">
      <path d="M 0,0 C -30,-10 -40,-60 0,-70 C 40,-60 30,-10 0,0 Z" fill="url(#goldBalloon)" />
      <polygon points="0,0 -6,10 6,10" fill="#FFB300" />
      <path d="M 0,10 Q -15,40 10,80" fill="none" stroke="#757575" stroke-width="2.5" />
    </g>
    <!-- Balloon Red -->
    <g transform="translate(-10, 30) scale(1)">
      <path d="M 0,0 C -30,-10 -40,-60 0,-70 C 40,-60 30,-10 0,0 Z" fill="url(#redBalloon)" />
      <polygon points="0,0 -6,10 6,10" fill="#B71C1C" />
      <path d="M 0,10 Q 20,40 -5,75" fill="none" stroke="#757575" stroke-width="2" />
    </g>
  </g>

  <!-- Big Balloon-like "81" at Top Right -->
  <g transform="translate(1060, 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="65" fill="#FFEB3B" stroke="#E53935" stroke-width="6" />
    <text x="0" y="22" font-family="'Outfit', sans-serif" font-weight="900" font-size="64" fill="#E53935" text-anchor="middle">81</text>
  </g>

  <!-- CORNER FIREWORKS & PARTY CONFETTI -->
  <!-- Left Side Confetti -->
  <g fill="#E53935" opacity="0.9">
    <circle cx="70" cy="550" r="12" fill="#E53935" />
    <circle cx="90" cy="720" r="16" fill="#FFEB3B" />
    <circle cx="65" cy="880" r="10" fill="#4CAF50" />
    <polygon points="90,620 95,635 110,635 98,643 102,658 90,648 78,658 82,643 70,635 85,635" fill="#FF9800" />
    <polygon points="75,800 78,810 88,810 80,816 83,826 75,820 67,826 70,816 62,810 72,810" fill="#03A9F4" />
    
    <!-- Party ribbon curves -->
    <path d="M 50,660 Q 80,680 60,700 Q 80,720 50,740" fill="none" stroke="#FF5722" stroke-width="5" stroke-linecap="round" />
    <path d="M 90,830 Q 120,850 100,870 Q 120,890 90,910" fill="none" stroke="#E53935" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Right Side Confetti -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="1130" cy="550" r="14" fill="#FFFFFF" stroke="#E53935" stroke-width="2" />
    <circle cx="1100" cy="720" r="10" fill="#E53935" />
    <circle cx="1125" cy="880" r="16" fill="#FFEB3B" />
    <polygon points="1110,620 1115,635 1130,635 1118,643 1122,658 1110,648 1098,658 1102,643 1090,635 1105,635" fill="#4CAF50" />
    
    <path d="M 1150,660 Q 1120,680 1140,700 Q 1120,720 1150,740" fill="none" stroke="#00BCD4" stroke-width="5" stroke-linecap="round" />
    <path d="M 1110,800 Q 1080,820 1100,840 Q 1080,860 1110,880" fill="none" stroke="#FFEB3B" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- BOTTOM DESIGN (Fun Wavy Banner with Flags) -->
  <g transform="translate(0, 1260)" filter="url(#shadow)">
    <!-- Wavy shapes -->
    <path d="M 0,80 Q 300,20 600,80 Q 900,140 1200,80 L 1200,240 L 0,240 Z" fill="#E53935" />
    <path d="M 0,100 Q 300,40 600,100 Q 900,160 1200,100" fill="none" stroke="#FFEB3B" stroke-width="6" />

    <text x="600" y="145" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      RT 05 KARANGJAMBE
    </text>
    <text x="600" y="195" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#FFEB3B" text-anchor="middle" letter-spacing="4">
      🎉 MERDEKA! 17 AGUSTUS 2026 🎉
    </text>
    
    <!-- Little cartoon flags at the bottom corners -->
    <g transform="translate(100, 110) scale(0.8)">
      <path d="M0,0 L30,-10 L30,20 L0,30 Z" fill="#FFFFFF" stroke="#111" stroke-width="2" />
      <path d="M0,-15 L30,-25 L30,0 L0,10 Z" fill="#E53935" stroke="#111" stroke-width="2" />
      <line x1="0" y1="-30" x2="0" y2="60" stroke="#111" stroke-width="4" stroke-linecap="round" />
    </g>
    <g transform="translate(1100, 110) scale(0.8) scale(-1, 1)">
      <path d="M0,0 L30,-10 L30,20 L0,30 Z" fill="#FFFFFF" stroke="#111" stroke-width="2" />
      <path d="M0,-15 L30,-25 L30,0 L0,10 Z" fill="#E53935" stroke="#111" stroke-width="2" />
      <line x1="0" y1="-30" x2="0" y2="60" stroke="#111" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
