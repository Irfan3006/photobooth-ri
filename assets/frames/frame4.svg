<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25" />
    </filter>
    
    <!-- Balloon Gradients -->
    <linearGradient id="goldBalloon4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <linearGradient id="redBalloon4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <linearGradient id="whiteBalloon4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- FESTIVE OUTER BORDERS -->
  <rect x="12" y="12" width="1176" height="1476" rx="24" fill="none" stroke="#E62129" stroke-width="12" />
  <rect x="22" y="22" width="1156" height="1456" rx="16" fill="none" stroke="#FFC107" stroke-width="6" />

  <!-- TOP HEADER BANNER (CLEAN & FESTIVE) -->
  <g filter="url(#shadow4)">
    <!-- Top Red Canopy -->
    <path d="M 22,22 L 1178,22 L 1178,200 Q 600,250 22,200 Z" fill="#E62129" />
    <path d="M 22,200 Q 600,250 1178,200" fill="none" stroke="#FFC107" stroke-width="5" />

    <!-- Top Badge: HUT RI KE-81 -->
    <g transform="translate(600, 75)">
      <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#FFC107" stroke="#FFFFFF" stroke-width="2" />
      <text x="0" y="7" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#B71C1C" text-anchor="middle" letter-spacing="2">
        HUT RI KE-81
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" font-family="'Outfit', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="188" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#FFEB3B" text-anchor="middle" letter-spacing="4">
      SEMARAK 17-AN KARANGJAMBE RT 05
    </text>
  </g>

  <!-- TOP CORNER BALLOON BUNDLES (NESTLED NEATLY AT CORNERS) -->
  <!-- Top-Left Balloon Cluster -->
  <g transform="translate(85, 95)" filter="url(#shadow4)">
    <!-- Red Balloon -->
    <ellipse cx="0" cy="0" rx="30" ry="38" fill="url(#redBalloon4)" />
    <ellipse cx="-8" cy="-10" rx="6" ry="12" fill="#FFFFFF" opacity="0.6" />
    <!-- White Balloon -->
    <ellipse cx="40" cy="15" rx="26" ry="34" fill="url(#whiteBalloon4)" />
    <ellipse cx="34" cy="5" rx="5" ry="10" fill="#FFFFFF" opacity="0.8" />
    <!-- Gold Balloon with 81 -->
    <ellipse cx="20" cy="45" rx="28" ry="36" fill="url(#goldBalloon4)" />
    <text x="20" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#B71C1C" text-anchor="middle">81</text>
  </g>

  <!-- Top-Right Balloon Cluster -->
  <g transform="translate(1085, 95)" filter="url(#shadow4)">
    <ellipse cx="0" cy="0" rx="30" ry="38" fill="url(#redBalloon4)" />
    <ellipse cx="-8" cy="-10" rx="6" ry="12" fill="#FFFFFF" opacity="0.6" />
    <ellipse cx="-40" cy="15" rx="26" ry="34" fill="url(#whiteBalloon4)" />
    <ellipse cx="-46" cy="5" rx="5" ry="10" fill="#FFFFFF" opacity="0.8" />
    <ellipse cx="-20" cy="45" rx="28" ry="36" fill="url(#goldBalloon4)" />
    <text x="-20" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#B71C1C" text-anchor="middle">81</text>
  </g>

  <!-- FESTIVE BUNTING FLAGS (Hanging Under Canopy) -->
  <g fill="#FFFFFF" opacity="0.95">
    <polygon points="170,195 210,198 190,245" fill="#E53935" />
    <polygon points="230,200 270,204 250,250" fill="#FFFFFF" />
    <polygon points="290,205 330,208 310,255" fill="#E53935" />
    
    <polygon points="870,208 910,205 890,255" fill="#E53935" />
    <polygon points="930,204 970,200 950,250" fill="#FFFFFF" />
    <polygon points="990,198 1030,195 1010,245" fill="#E53935" />
  </g>

  <!-- BOTTOM FESTIVE FOOTER BANNER -->
  <g transform="translate(0, 1310)" filter="url(#shadow4)">
    <path d="M 22,60 Q 600,0 1178,60 L 1178,166 L 22,166 Z" fill="#E62129" />
    <path d="M 22,60 Q 600,0 1178,60" fill="none" stroke="#FFC107" stroke-width="5" />

    <!-- Center Badge -->
    <g transform="translate(600, 75)">
      <rect x="-260" y="-30" width="520" height="60" rx="30" fill="#FFFFFF" stroke="#FFC107" stroke-width="3" />
      <text x="0" y="12" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#B71C1C" text-anchor="middle" letter-spacing="2">
        KARANGJAMBE RT 05
      </text>
    </g>

    <text x="600" y="145" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      MERDEKA! &#8226; 17 AGUSTUS 2026
    </text>
  </g>
</svg>
