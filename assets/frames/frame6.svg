<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Red Dynamic Gradient -->
    <linearGradient id="speedRed6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333A" />
      <stop offset="50%" stop-color="#E62129" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Gold Dynamic Gradient -->
    <linearGradient id="goldGlow6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- MODERN DYNAMIC FRAME BORDERS -->
  <rect x="14" y="14" width="1172" height="1472" rx="20" fill="none" stroke="url(#speedRed6)" stroke-width="12" />
  <rect x="24" y="24" width="1152" height="1452" rx="14" fill="none" stroke="#FFFFFF" stroke-width="4" />

  <!-- TOP BANNER (SYMMETRICAL DYNAMIC CHEVRON) -->
  <g filter="url(#shadow6)">
    <path d="M 24,24 L 1176,24 L 1176,190 L 600,240 L 24,190 Z" fill="url(#speedRed6)" />
    <path d="M 24,190 L 600,240 L 1176,190" fill="none" stroke="url(#goldGlow6)" stroke-width="5" />

    <!-- Center 81 Slanted Golden Crest -->
    <g transform="translate(600, 75)">
      <polygon points="-50,-24 40,-24 50,24 -40,24" fill="#FFFFFF" stroke="url(#goldGlow6)" stroke-width="3" />
      <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="900" font-size="40" fill="#E62129" text-anchor="middle">81</text>
    </g>

    <!-- Centered Typography -->
    <text x="600" y="152" font-family="'Outfit', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="190" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="url(#goldGlow6)" text-anchor="middle" letter-spacing="5">
      BANGKIT BERSAMA &#8226; MAJU JAYA
    </text>
  </g>

  <!-- SIDE DYNAMIC SPEED CUTS (CLEAN & NON-OBTRUSIVE) -->
  <g fill="url(#speedRed6)" opacity="0.85">
    <polygon points="24,520 60,535 60,570 24,585" />
    <polygon points="24,620 50,630 50,655 24,665" fill="url(#goldGlow6)" />

    <polygon points="1176,520 1140,535 1140,570 1176,585" />
    <polygon points="1176,620 1150,630 1150,655 1176,665" fill="url(#goldGlow6)" />
  </g>

  <!-- BOTTOM BANNER (SYMMETRICAL DYNAMIC CHEVRON) -->
  <g filter="url(#shadow6)">
    <path d="M 24,1300 L 600,1250 L 1176,1300 L 1176,1476 L 24,1476 Z" fill="url(#speedRed6)" />
    <path d="M 24,1300 L 600,1250 L 1176,1300" fill="none" stroke="url(#goldGlow6)" stroke-width="5" />

    <!-- Center Giant "MERDEKA!" -->
    <text x="600" y="1350" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">
      MERDEKA!
    </text>
    
    <!-- RT 05 Pill Badge -->
    <g transform="translate(600, 1400)">
      <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#FFFFFF" stroke="url(#goldGlow6)" stroke-width="2" />
      <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#E62129" text-anchor="middle" letter-spacing="3">
        KARANGJAMBE RT 05
      </text>
    </g>

    <!-- Bottom Date Info -->
    <text x="600" y="1452" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#goldGlow6)" text-anchor="middle" letter-spacing="4">
      17 AGUSTUS 1945 - 17 AGUSTUS 2026
    </text>
  </g>
</svg>
