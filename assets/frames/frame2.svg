<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Paper Texture Gradient -->
    <linearGradient id="vintagePaper2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#F5EFE0" />
      <stop offset="100%" stop-color="#E8DCBF" />
    </linearGradient>

    <!-- Dark Red Vintage Gradient -->
    <linearGradient id="darkRedGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#4A0E17" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- SOLID VINTAGE POSTER BORDER -->
  <rect x="0" y="0" width="1200" height="220" fill="url(#darkRedGrad2)" />
  <rect x="0" y="220" width="1200" height="12" fill="#FFFFFF" />
  
  <!-- Left & Right Vertical Pillars -->
  <rect x="0" y="232" width="36" height="1048" fill="#4A0E17" />
  <rect x="1164" y="232" width="36" height="1048" fill="#4A0E17" />
  <rect x="36" y="232" width="8" height="1048" fill="#FFFFFF" />
  <rect x="1156" y="232" width="8" height="1048" fill="#FFFFFF" />

  <!-- Bottom Solid Base -->
  <rect x="0" y="1280" width="1200" height="220" fill="url(#vintagePaper2)" stroke="#4A0E17" stroke-width="8" />

  <!-- TOP HEADER TEXTS -->
  <g filter="url(#shadow2)">
    <text x="600" y="80" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="152" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="64" fill="url(#goldGrad2)" text-anchor="middle" letter-spacing="3">
      HUT RI KE-81
    </text>
    <text x="600" y="195" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
      17 AGUSTUS 1945 &bull; 17 AGUSTUS 2026
    </text>
  </g>

  <!-- BOTTOM DESIGN: VINTAGE 1945 HISTORICAL TRIBUTE -->
  <!-- Left Side: Silhouette of Sukarno Reading Proklamasi Text -->
  <g transform="translate(60, 1040) scale(1.6)" filter="url(#shadow2)">
    <!-- Body -->
    <path d="M 50,-10 C 35,-10 25,10 25,30 L 25,150 L 95,150 L 95,30 C 95,10 85,-10 70,-10 Z" fill="#111111" />
    <!-- Head with Peci -->
    <circle cx="60" cy="-35" r="16" fill="#111111" />
    <polygon points="46,-47 74,-47 69,-32 51,-32" fill="#111111" />
    <!-- Reading sheet (Proklamasi Paper) -->
    <path d="M 70,-20 L 112,-35 L 117,-10 L 75,0 Z" fill="#FDFBF7" stroke="#111111" stroke-width="1.5" />
    <!-- Arm holding paper -->
    <path d="M 75,-5 L 90,-20 L 98,-15 L 82,5 Z" fill="#111111" />
    
    <!-- Vintage Microphones silhouette in front of him -->
    <g transform="translate(112, -5)" fill="#424242">
      <line x1="10" y1="-40" x2="10" y2="140" stroke="#111111" stroke-width="3" />
      <rect x="4" y="-55" width="12" height="15" rx="3" fill="#111111" stroke="#FFFFFF" stroke-width="0.5" />
      <circle cx="10" cy="-60" r="4" fill="#111111" />
    </g>
  </g>

  <!-- Center-Right: Big Dynamic "MERDEKA!" -->
  <g transform="translate(700, 1375)">
    <!-- Red Paint Brush Splash behind Merdeka -->
    <path d="M -230,-45 Q -100,-75 60,-52 Q 220,-30 270,-10 Q 160,45 -20,25 Q -160,55 -230,-45 Z" fill="url(#darkRedGrad2)" filter="url(#shadow2)" />
    
    <text x="15" y="0" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
      MERDEKA!
    </text>
  </g>

  <!-- Bottom Left Info Stamp -->
  <g transform="translate(230, 1315)">
    <text x="0" y="30" font-family="'Outfit', sans-serif" font-weight="900" font-size="32" fill="#4A0E17" letter-spacing="1">
      KARANGJAMBE RT 05
    </text>
    <text x="0" y="66" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#7F8C8D" letter-spacing="3">
      PERINGATAN 17 AGUSTUS 2026
    </text>
    <text x="0" y="100" font-family="'Courier New', monospace" font-weight="800" font-size="18" fill="#B71C1C" letter-spacing="1">
      Naskah Otentik Proklamasi 1945
    </text>
  </g>

  <!-- Right corner: Official seal badge -->
  <g transform="translate(1070, 1370) scale(0.9)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#B71C1C" stroke-width="4" stroke-dasharray="6, 4" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#4A0E17" stroke-width="2" />
    <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#B71C1C" text-anchor="middle">81</text>
  </g>
</svg>
