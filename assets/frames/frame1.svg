<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Paper Texture Gradient -->
    <linearGradient id="vintagePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3E9" />
      <stop offset="50%" stop-color="#F2EAD8" />
      <stop offset="100%" stop-color="#EBE0C5" />
    </linearGradient>
    
    <!-- Red Poster Gradient -->
    <linearGradient id="posterRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#7F0000" />
    </linearGradient>

    <!-- Shadow for banners -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Frame border (Vintage Poster style) -->
  <!-- Top Banner -->
  <rect x="0" y="0" width="1200" height="200" fill="url(#posterRed)" />
  <rect x="0" y="200" width="1200" height="15" fill="#E62129" />
  <rect x="0" y="215" width="1200" height="10" fill="#FFFFFF" />
  
  <!-- Side Borders (Thin red-white stripes) -->
  <rect x="0" y="225" width="30" height="1075" fill="#B71C1C" />
  <rect x="30" y="225" width="10" height="1075" fill="#FFFFFF" />
  
  <rect x="1170" y="225" width="30" height="1075" fill="#B71C1C" />
  <rect x="1160" y="225" width="10" height="1075" fill="#FFFFFF" />

  <!-- Bottom Banner (Heavy Vintage Paper Background) -->
  <rect x="0" y="1300" width="1200" height="200" fill="url(#vintagePaper)" />
  <rect x="0" y="1290" width="1200" height="10" fill="#FFFFFF" />
  <rect x="0" y="1275" width="1200" height="15" fill="#B71C1C" />

  <!-- TOP TEXT DESIGN -->
  <g filter="url(#dropShadow)">
    <text x="600" y="90" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      DIRGAHAYU
    </text>
    <text x="600" y="155" font-family="'Outfit', 'Impact', sans-serif" font-weight="800" font-size="44" fill="#FFEB3B" text-anchor="middle" letter-spacing="2">
      REPUBLIK INDONESIA KE-81
    </text>
  </g>

  <!-- BOTTOM TEXT DESIGN (Vintage Stamp Style) -->
  <g>
    <!-- Stamp Border -->
    <rect x="250" y="1325" width="700" height="140" fill="none" stroke="#B71C1C" stroke-width="4" stroke-dasharray="15, 8" rx="10" />
    <rect x="258" y="1333" width="684" height="124" fill="none" stroke="#B71C1C" stroke-width="2" rx="6" />
    
    <text x="600" y="1385" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#B71C1C" text-anchor="middle" letter-spacing="3">
      KARANGJAMBE RT 05
    </text>
    <text x="600" y="1430" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#111111" text-anchor="middle" letter-spacing="6">
      17 AGUSTUS 2026
    </text>
  </g>

  <!-- LEFT SIDE: Silhouette of Pejuang (Freedom Fighters) with bamboo spears -->
  <!-- Silhouettes are dark red/black overlaying the bottom-left -->
  <g transform="translate(35, 1050) scale(1.6)" fill="#111111">
    <!-- Bamboo Spear 1 -->
    <path d="M 10,-200 L 14,-200 L 12,-230 Z" />
    <line x1="12" y1="-200" x2="12" y2="150" stroke="#111111" stroke-width="4" />
    
    <!-- Fighter 1 (Raising Bamboo Spear) -->
    <circle cx="40" cy="-60" r="15" />
    <path d="M 40,-45 C 30,-45 20,-35 20,-20 L 20,150 L 60,150 L 60,-20 C 60,-35 50,-45 40,-45 Z" />
    <!-- Arm raising spear -->
    <path d="M 25,-30 L 12,-70 L 12,-55 L 25,-15 Z" />
    <!-- Peci headwear silhouette -->
    <polygon points="28,-72 52,-72 48,-60 32,-60" />
  </g>

  <g transform="translate(130, 1100) scale(1.3)" fill="#424242">
    <!-- Fighter 2 (Saluting/Holding Flag) -->
    <circle cx="40" cy="-60" r="14" />
    <polygon points="28,-71 52,-71 47,-60 33,-60" />
    <path d="M 40,-45 C 30,-45 22,-35 22,-20 L 22,150 L 58,150 L 58,-20 C 58,-35 50,-45 40,-45 Z" />
    <path d="M 55,-30 L 75,-60 L 85,-55 L 58,-15 Z" />
    <!-- Spear -->
    <path d="M 78,-160 L 82,-160 L 80,-185 Z" fill="#424242" />
    <line x1="80" y1="-160" x2="80" y2="150" stroke="#424242" stroke-width="3" />
  </g>

  <!-- RIGHT SIDE: Waving Indonesian Flag -->
  <g transform="translate(950, 1080) scale(1.6)">
    <!-- Flag Pole -->
    <rect x="10" y="-120" width="8" height="270" fill="#795548" rx="2" />
    <circle cx="14" cy="-122" r="8" fill="#FFC107" />
    
    <!-- Flag Fabric Waving (Red on top, White on bottom) -->
    <!-- Red half -->
    <path d="M 18,-115 Q 50,-130 80,-115 Q 110,-100 140,-115 L 140,-70 Q 110,-55 80,-70 Q 50,-85 18,-70 Z" fill="#B71C1C" />
    <!-- White half -->
    <path d="M 18,-70 Q 50,-85 80,-70 Q 110,-55 140,-70 L 140,-25 Q 110,-10 80,-25 Q 50,-40 18,-25 Z" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.5" />
    
    <!-- Silhouette of pejuang holding the flag -->
    <g fill="#111111" transform="translate(-40, 20)">
      <circle cx="30" cy="-60" r="14" />
      <polygon points="18,-71 42,-71 38,-60 22,-60" />
      <path d="M 30,-45 C 20,-45 12,-35 12,-20 L 12,130 L 48,130 L 48,-20 C 48,-35 40,-45 30,-45 Z" />
      <!-- Arm holding pole -->
      <path d="M 45,-30 L 60,-50 L 60,-35 L 45,-15 Z" />
    </g>
  </g>

  <!-- Subtle Vintage Texture Overlay (Faded frames corners) -->
  <g opacity="0.08" fill="#111111">
    <path d="M 40,240 L 120,240 L 40,320 Z" />
    <path d="M 1160,240 L 1080,240 L 1160,320 Z" />
    <path d="M 40,1260 L 120,1260 L 40,1180 Z" />
    <path d="M 1160,1260 L 1080,1260 L 1160,1180 Z" />
  </g>
</svg>
