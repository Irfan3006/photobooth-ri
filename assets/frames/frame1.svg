<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Primary Red Gradients -->
    <linearGradient id="redGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333A" />
      <stop offset="50%" stop-color="#E62129" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <linearGradient id="darkRed1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <!-- Gold Gradients for Anniversary Badges -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFD700" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- OUTER BORDERS -->
  <rect x="12" y="12" width="1176" height="1476" rx="24" fill="none" stroke="url(#redGrad1)" stroke-width="12" />
  <rect x="24" y="24" width="1152" height="1452" rx="16" fill="none" stroke="#FFFFFF" stroke-width="6" />
  <rect x="34" y="34" width="1132" height="1432" rx="12" fill="none" stroke="url(#goldGrad1)" stroke-width="3" opacity="0.85" />

  <!-- TOP HEADER BANNER (Dynamic Wave and Flags) -->
  <g filter="url(#shadow1)">
    <!-- Top Red Arch -->
    <path d="M 34,34 L 1166,34 L 1166,220 Q 600,280 34,220 Z" fill="url(#redGrad1)" />
    <!-- White Wave Ribbon Accent -->
    <path d="M 34,220 Q 600,280 1166,220 L 1166,236 Q 600,296 34,236 Z" fill="#FFFFFF" />
    <!-- Gold Accent Line -->
    <path d="M 34,236 Q 600,296 1166,236 L 1166,242 Q 600,302 34,242 Z" fill="url(#goldGrad1)" />
  </g>

  <!-- Left and Right Hanging Pennant Buntings (Festive Independence) -->
  <g fill="#FFFFFF" opacity="0.95">
    <polygon points="60,34 95,34 80,100" fill="#FFFFFF" />
    <polygon points="60,34 95,34 77,70" fill="#B71C1C" />
    <polygon points="110,34 145,34 130,110" fill="#FFFFFF" />
    <polygon points="110,34 145,34 127,75" fill="#B71C1C" />
    <polygon points="160,34 195,34 180,100" fill="#FFFFFF" />
    <polygon points="160,34 195,34 177,70" fill="#B71C1C" />

    <polygon points="1005,34 1040,34 1025,100" fill="#FFFFFF" />
    <polygon points="1005,34 1040,34 1023,70" fill="#B71C1C" />
    <polygon points="1055,34 1090,34 1075,110" fill="#FFFFFF" />
    <polygon points="1055,34 1090,34 1073,75" fill="#B71C1C" />
    <polygon points="1105,34 1140,34 1125,100" fill="#FFFFFF" />
    <polygon points="1105,34 1140,34 1123,70" fill="#B71C1C" />
  </g>

  <!-- TOP HEADER TEXTS AND 81 ANNIVERSARY SHIELD -->
  <!-- Center 81 Laurel Badge -->
  <g transform="translate(600, 115)" filter="url(#shadow1)">
    <!-- Golden Shield Badge -->
    <rect x="-80" y="-55" width="160" height="110" rx="20" fill="url(#goldGrad1)" stroke="#FFFFFF" stroke-width="4" />
    <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="900" font-size="78" fill="#B71C1C" text-anchor="middle" letter-spacing="-1">81</text>
    
    <!-- Flag Strip on Badge -->
    <rect x="-60" y="-45" width="120" height="10" rx="3" fill="#E62129" />
    <rect x="-60" y="-35" width="120" height="10" rx="3" fill="#FFFFFF" />
  </g>

  <!-- Top Title Texts -->
  <g filter="url(#shadow1)">
    <text x="600" y="195" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="235" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="url(#goldGrad1)" text-anchor="middle" letter-spacing="6">
      17 AGUSTUS 1945 - 17 AGUSTUS 2026
    </text>
  </g>

  <!-- SIDE ACCENTS (Subtle Indonesian Flag Ribbons) -->
  <g opacity="0.9">
    <!-- Left Ribbon -->
    <path d="M 34,600 Q 80,680 34,760 L 50,760 Q 96,680 50,600 Z" fill="#E62129" />
    <path d="M 50,600 Q 96,680 50,760 L 62,760 Q 108,680 62,600 Z" fill="#FFFFFF" />

    <!-- Right Ribbon -->
    <path d="M 1166,600 Q 1120,680 1166,760 L 1150,760 Q 1104,680 1150,600 Z" fill="#E62129" />
    <path d="M 1150,600 Q 1104,680 1150,760 L 1138,760 Q 1092,680 1138,600 Z" fill="#FFFFFF" />
  </g>

  <!-- BOTTOM FOOTER BANNER (Bold and Patriotic) -->
  <g filter="url(#shadow1)">
    <!-- Curved Base Panel -->
    <path d="M 34,1270 Q 600,1210 1166,1270 L 1166,1466 L 34,1466 Z" fill="url(#darkRed1)" />
    <!-- Gold Top Edge -->
    <path d="M 34,1270 Q 600,1210 1166,1270" fill="none" stroke="url(#goldGrad1)" stroke-width="6" />
    <path d="M 34,1282 Q 600,1222 1166,1282" fill="none" stroke="#FFFFFF" stroke-width="3" />

    <!-- Main RT 05 Stamp / Badge -->
    <g transform="translate(600, 1340)">
      <rect x="-280" y="-35" width="560" height="70" rx="35" fill="url(#goldGrad1)" stroke="#FFFFFF" stroke-width="4" filter="url(#shadow1)" />
      <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="900" font-size="40" fill="#B71C1C" text-anchor="middle" letter-spacing="3">
        KARANGJAMBE RT 05
      </text>
    </g>

    <!-- Tagline and Slogan -->
    <text x="600" y="1425" font-family="'Outfit', sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      NUSANTARA BARU &#8226; INDONESIA MAJU
    </text>
  </g>

  <!-- Corner Golden Stars -->
  <g fill="url(#goldGrad1)" filter="url(#glow1)">
    <!-- Top Left -->
    <polygon points="65,65 72,80 88,82 76,94 80,110 65,101 50,110 54,94 42,82 58,80" />
    <!-- Top Right -->
    <polygon points="1135,65 1142,80 1158,82 1146,94 1150,110 1135,101 1120,110 1124,94 1112,82 1128,80" />
    <!-- Bottom Left -->
    <polygon points="80,1400 85,1412 98,1413 88,1423 91,1435 80,1428 69,1435 72,1423 62,1413 75,1412" />
    <!-- Bottom Right -->
    <polygon points="1120,1400 1125,1412 1138,1413 1128,1423 1131,1435 1120,1428 1109,1435 1112,1423 1102,1413 1115,1412" />
  </g>
</svg>
