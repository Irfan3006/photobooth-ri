<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Deep Red -->
    <linearGradient id="deepRed5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#990006" />
      <stop offset="50%" stop-color="#730004" />
      <stop offset="100%" stop-color="#4A0002" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.38" />
    </filter>

    <!-- Refined Traditional Batik Parang Pattern -->
    <pattern id="batikParang5" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0,0 C 12,0 12,25 25,25 C 37,25 37,0 50,0 L 50,12 C 37,12 37,37 25,37 C 12,37 12,12 0,12 Z" fill="#FFD54F" opacity="0.8" />
      <path d="M 0,25 C 12,25 12,50 25,50 C 37,50 37,25 50,25 L 50,37 C 37,37 37,62 25,62 C 12,62 12,37 0,37 Z" fill="#FFA000" opacity="0.8" />
    </pattern>
  </defs>

  <!-- SOLID LUXURY BORDERS -->
  <rect x="12" y="12" width="1176" height="1476" rx="24" fill="none" stroke="url(#goldGrad5)" stroke-width="10" />
  <rect x="22" y="22" width="1156" height="1456" rx="16" fill="none" stroke="url(#deepRed5)" stroke-width="8" />

  <!-- SLIM ELEGANT BATIK SIDE PILLARS (W=65px) -->
  <rect x="30" y="30" width="65" height="1440" fill="url(#deepRed5)" />
  <rect x="30" y="30" width="65" height="1440" fill="url(#batikParang5)" />
  <line x1="95" y1="30" x2="95" y2="1470" stroke="url(#goldGrad5)" stroke-width="3" />

  <rect x="1105" y="30" width="65" height="1440" fill="url(#deepRed5)" />
  <rect x="1105" y="30" width="65" height="1440" fill="url(#batikParang5)" />
  <line x1="1105" y1="30" x2="1105" y2="1470" stroke="url(#goldGrad5)" stroke-width="3" />

  <!-- TOP ROYAL BANNER -->
  <g filter="url(#shadow5)">
    <path d="M 95,30 L 1105,30 L 1105,210 Q 600,250 95,210 Z" fill="url(#deepRed5)" stroke="url(#goldGrad5)" stroke-width="3" />

    <!-- Center 81 Gold Medallion -->
    <g transform="translate(600, 85)">
      <polygon points="0,-40 28,-28 40,0 28,28 0,40 -28,28 -40,0 -28,-28" fill="url(#goldGrad5)" stroke="#FFFFFF" stroke-width="2" />
      <polygon points="0,-32 22,-22 32,0 22,22 0,32 -22,22 -32,0 -22,-22" fill="#730004" />
      <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="900" font-size="42" fill="url(#goldGrad5)" text-anchor="middle">81</text>
    </g>

    <!-- Top Titles -->
    <text x="600" y="160" font-family="'Outfit', sans-serif" font-weight="900" font-size="38" fill="url(#goldGrad5)" text-anchor="middle" letter-spacing="3">
      DIRGAHAYU REPUBLIK INDONESIA
    </text>
    <text x="600" y="196" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">
      HUT RI KE-81 &#8226; 17 AGUSTUS 2026
    </text>
  </g>

  <!-- BOTTOM ROYAL BATIK BASE -->
  <g filter="url(#shadow5)">
    <path d="M 95,1280 Q 600,1240 1105,1280 L 1105,1470 L 95,1470 Z" fill="url(#deepRed5)" stroke="url(#goldGrad5)" stroke-width="3" />

    <!-- Center Plaque -->
    <g transform="translate(600, 1345)">
      <rect x="-270" y="-32" width="540" height="64" rx="32" fill="url(#goldGrad5)" stroke="#FFFFFF" stroke-width="3" />
      <text x="0" y="12" font-family="'Outfit', sans-serif" font-weight="900" font-size="36" fill="#730004" text-anchor="middle" letter-spacing="3">
        KARANGJAMBE RT 05
      </text>
    </g>

    <text x="600" y="1428" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">
      BATIK NUSANTARA &#8226; WARISAN BUDAYA BANGSA
    </text>
  </g>
</svg>
